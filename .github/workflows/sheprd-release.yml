# sheprd: build static Linux (x86_64, aarch64) and macOS (Apple Silicon, Intel) binaries and
# publish them as one GitHub release on every `sheprd-v*` tag (e.g. sheprd-v0.9.3-1). Upstream
# workflows are disabled on this fork; this is the only one that runs. Build steps follow
# upstream's build-artifacts-manual.yml.
name: sheprd release

on:
  push:
    tags: ['sheprd-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: sheprd-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: sheprd-linux-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: sheprd-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: sheprd-macos-x86_64
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-${{ matrix.target }}

      - name: Build
        run: |
          rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}
          file ${{ matrix.name }}
          if [ "$RUNNER_OS" = Linux ]; then
            file ${{ matrix.name }} | grep -qE "statically linked|static-pie linked"
          fi
          python3 -c "import hashlib, pathlib; p = pathlib.Path('${{ matrix.name }}'); print(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}')" > ${{ matrix.name }}.sha256
          cat ${{ matrix.name }}.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
          retention-days: 7

  publish:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* scripts/sheprd-install \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "sheprd build of $(git rev-parse --short HEAD) on herdr ${GITHUB_REF_NAME#sheprd-v}: Linux x86_64 / aarch64 (static) and macOS Apple Silicon / Intel (unsigned). See the README for what differs from herdr."
