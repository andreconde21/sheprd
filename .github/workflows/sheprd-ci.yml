# sheprd: the full test suite on every pull request and push to main (Linux). The laptop that
# develops sheprd can't run the whole suite in memory, so this is where it runs. Upstream's ci.yml
# only runs in herdrdev/herdr.
name: sheprd CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheprd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: sheprd-ci

      - name: Build tests
        # The vendored ghostty build downloads its deps; retry once on a network blip.
        run: cargo nextest run --locked --no-run || { sleep 30; cargo nextest run --locked --no-run; }

      - name: Test
        run: cargo nextest run --locked --no-fail-fast --status-level fail --final-status-level slow --failure-output final --success-output never

      - name: Bundled scripts parse
        run: |
          for script in scripts/sheprd-msg scripts/sheprd-claude-hook scripts/sheprd-doc scripts/sheprd-status-github; do
            python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$script"
          done
